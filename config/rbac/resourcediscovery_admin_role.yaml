# This rule is not used by the project opg-ewbi-agreement-exchanger itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over policy.opg.ewbi.katalis.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opg-ewbi-agreement-exchanger
    app.kubernetes.io/managed-by: kustomize
  name: resourcediscovery-admin-role
rules:
- apiGroups:
  - policy.opg.ewbi.katalis.com
  resources:
  - resourcediscoveries
  verbs:
  - '*'
- apiGroups:
  - policy.opg.ewbi.katalis.com
  resources:
  - resourcediscoveries/status
  verbs:
  - get
