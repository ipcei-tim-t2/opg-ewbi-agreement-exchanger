---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - policy.opg.ewbi.katalis.com
  resources:
  - federationagreements
  - resourcediscoveries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.opg.ewbi.katalis.com
  resources:
  - federationagreements/finalizers
  - resourcediscoveries/finalizers
  verbs:
  - update
- apiGroups:
  - policy.opg.ewbi.katalis.com
  resources:
  - federationagreements/status
  - resourcediscoveries/status
  verbs:
  - get
  - patch
  - update
